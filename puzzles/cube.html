<title>Куб в кубе</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600&display=swap">
<style>
/* Слева — куб, который можно вертеть; справа — текущее слово, слои 3×3 и найденные слова */
:root {
  --bg: #f3f4ec;
  --panel: #ffffff;
  --ink: #1f2a1c;
  --muted: #66705f;
  --line: #d9ddcd;
  --cell: #fbfcf6;
  --cell-ink: #2b3527;
  --accent: #d2462f;      /* томатный */
  --accent-2: #4f8a2b;    /* ботва */
  --sel: #f2b51d;         /* выделение */
  --sel-ink: #2b2100;
  --found: #4f8a2b;
  --font-display: "Unbounded", "Golos Text", system-ui, sans-serif;
  --font-body: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151a13; --panel: #1d241a; --ink: #e9eedf; --muted: #9ba890; --line: #2f3a2a;
    --cell: #263022; --cell-ink: #eef3e4; --accent: #ef6a4f; --accent-2: #8cc45a;
    --sel: #f5c542; --sel-ink: #241c00; --found: #8cc45a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151a13; --panel: #1d241a; --ink: #e9eedf; --muted: #9ba890; --line: #2f3a2a;
  --cell: #263022; --cell-ink: #eef3e4; --accent: #ef6a4f; --accent-2: #8cc45a;
  --sel: #f5c542; --sel-ink: #241c00; --found: #8cc45a; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 32px;
}
.wrap { max-width: 1120px; margin: 0 auto; display: grid; gap: 18px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 20px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(22px, 4vw, 32px); margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h1 span { color: var(--accent); }
.rules { margin: 0; color: var(--muted); max-width: 62ch; line-height: 1.45; }
.main { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 820px) { .main { grid-template-columns: minmax(0, 1fr); } }
.stage { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; aspect-ratio: 1 / 1; max-width: 100%; touch-action: none; }
.stage canvas { display: block; width: 100%; height: 100%; cursor: grab; }
.stage canvas:active { cursor: grabbing; }
.stagebox { display: grid; gap: 8px; min-width: 0; }
.stage-ui { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.hint { font-size: 12px; color: var(--muted); background: color-mix(in srgb, var(--panel) 85%, transparent); padding: 4px 8px; border-radius: 6px; }
label.spread { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); background: color-mix(in srgb, var(--panel) 85%, transparent); padding: 4px 8px; border-radius: 6px; }
.side { display: grid; gap: 14px; min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; gap: 10px; min-width: 0; }
.card h2 { margin: 0; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.word { font-family: var(--font-display); font-size: 26px; min-height: 36px; letter-spacing: 0.06em; text-transform: uppercase; word-break: break-all; }
.word.empty { color: var(--muted); font-family: var(--font-body); font-size: 15px; letter-spacing: 0; text-transform: none; }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
button { font: inherit; font-weight: 600; border-radius: 9px; padding: 8px 14px; border: 1px solid var(--line); background: var(--cell); color: var(--ink); cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--sel); outline-offset: 2px; }
.msg { min-height: 20px; font-size: 14px; color: var(--muted); }
.msg.ok { color: var(--found); font-weight: 600; }
.msg.bad { color: var(--accent); }
.layers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.layer { display: grid; gap: 4px; }
.layer small { color: var(--muted); font-size: 11px; text-align: center; letter-spacing: 0.06em; text-transform: uppercase; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
.cellbtn { aspect-ratio: 1; padding: 0; border-radius: 6px; font-family: var(--font-display); font-weight: 500; font-size: clamp(13px, 2.4vw, 17px); text-transform: uppercase; background: var(--cell); color: var(--cell-ink); }
.cellbtn.sel { background: var(--sel); color: var(--sel-ink); border-color: var(--sel); }
.cellbtn.last { box-shadow: 0 0 0 2px var(--accent) inset; }
.cellbtn.can { border-color: var(--accent-2); }
.cellbtn.gone { background: transparent; border-style: dashed; cursor: default; }
.progress { display: flex; align-items: baseline; gap: 8px; }
.progress b { font-family: var(--font-display); font-size: 22px; font-variant-numeric: tabular-nums; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--found); width: 0; transition: width .3s; }
.found { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 13px; padding: 3px 9px; border-radius: 999px; background: color-mix(in srgb, var(--found) 16%, var(--panel)); color: var(--ink); border: 1px solid color-mix(in srgb, var(--found) 40%, var(--line)); }
.chip.bonus { background: transparent; border-style: dashed; }
.chip.slot { display: inline-flex; gap: 2px; align-items: center; background: transparent; border-color: var(--line); padding: 5px 8px; }
.chip.slot i { width: 9px; height: 9px; border: 1px solid var(--muted); border-radius: 2px; opacity: 0.7; }
.bonusrow { align-items: center; }
.bonusrow small { color: var(--muted); font-size: 12px; }
.chip.ghost { background: transparent; color: var(--muted); border-style: dashed; cursor: default; }
.chip.answer { background: transparent; border-color: var(--line); color: var(--muted); }
details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>

<div class="wrap">
  <header>
    <h1>Куб <span>в кубе</span></h1>
    <p class="rules">Найди геометрические фигуры и тела. Буквы слова идут по соседним кубикам — соседи и по граням, и по рёбрам, и по углам, во всех трёх измерениях. Один кубик в слове используется один раз.</p>
  </header>

  <div class="main">
    <div class="stagebox">
      <div class="stage" id="stage"></div>
      <div class="stage-ui">
        <span class="hint">Тяни — вертеть, колесо или щипок — масштаб, клик — буква</span>
        <label class="spread" for="spread">Раздвинуть <input id="spread" type="range" min="1.15" max="2.4" step="0.05" value="1.75"></label>
      </div>
    </div>

    <div class="side">
      <section class="card" aria-live="polite">
        <h2>Слово</h2>
        <div class="word empty" id="word">Выбери первую букву</div>
        <div class="row">
          <button id="clear">Сбросить выбор</button>
        </div>
        <div class="msg" id="msg"></div>
      </section>

      <section class="card">
        <div class="layers" id="layers"></div>
      </section>

      <section class="card">
        <div class="progress"><b id="count">0</b><span id="total">из 0</span></div>
        <div class="bar"><i id="bar"></i></div>
        <div class="found" id="found"></div>
        <div class="found bonusrow" id="bonus" hidden></div>
        <div class="row"><button id="reset">Начать заново</button></div>
      </section>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// ---------- данные ----------
// Клетка i = x + 3*y + 9*z; z = 0 — верхний слой.
const BOARD = "яэтдрерцтбсеиоалкпзмсьугншч";
const DICT = "точка тессеракт отрезок луч прямая куб тетраэдр октаэдр додекаэдр икосаэдр круг квадрат ромб трапеция треугольник прямоугольник пятиугольник шестиугольник многоугольник параллелограмм эллипс шар конус цилиндр призма пирамида тор кольцо эллипсоид параллелепипед".split(" ");
// Бонус: элементы фигур, термины и редкие фигуры. Засчитываются, но не обязательны и не влияют на исчезновение букв.
const BONUS = "крест овал окружность полукруг сфера звезда угол дуга хорда радиус диаметр вектор сектор сегмент грань ребро вершина ось центр медиана высота катет диагональ плоскость линия апофема гипотенуза биссектриса площадь объем периметр сторона синус косинус тангенс аксиома теорема циркуль линейка транспортир градус гексаэдр полиэдр дельтоид многогранник спираль клин угольник фокус сфероид кривая гиперкуб кубоид".split(" ");
const STORE = "geo-cube-" + BOARD;

const C = [...Array(27)].map((_, i) => ({ x: i % 3, y: Math.floor(i / 3) % 3, z: Math.floor(i / 9) }));
const adj = (a, b) => a !== b && Math.max(Math.abs(C[a].x - C[b].x), Math.abs(C[a].y - C[b].y), Math.abs(C[a].z - C[b].z)) <= 1;

function findPath(w) {
  const used = new Array(27).fill(false), path = [];
  function dfs(i, k) {
    if (BOARD[i] !== w[k] || used[i]) return false;
    used[i] = true; path.push(i);
    if (k === w.length - 1) return true;
    for (let j = 0; j < 27; j++) if (adj(i, j) && dfs(j, k + 1)) return true;
    used[i] = false; path.pop(); return false;
  }
  for (let i = 0; i < 27; i++) if (dfs(i, 0)) return path.slice();
  return null;
}
const ANSWERS = DICT.filter(w => findPath(w)).sort((a, b) => a.localeCompare(b, "ru"));
const BONUS_ANS = BONUS.filter(w => findPath(w));
const mainFound = () => found.filter(w => ANSWERS.includes(w));

// Клетки, через которые проходит хоть один путь хоть одного ещё не найденного слова.
function liveCells(left) {
  const live = new Set(), used = new Array(27).fill(false), path = [];
  function dfs(w, i, k) {
    if (BOARD[i] !== w[k] || used[i]) return;
    used[i] = true; path.push(i);
    if (k === w.length - 1) path.forEach(j => live.add(j));
    else for (let j = 0; j < 27; j++) if (adj(i, j)) dfs(w, j, k + 1);
    used[i] = false; path.pop();
  }
  left.forEach(w => { for (let i = 0; i < 27; i++) dfs(w, i, 0); });
  return live;
}

// ---------- состояние ----------
let sel = [];
let found = [];
try { found = JSON.parse(localStorage.getItem(STORE) || "[]").filter(w => ANSWERS.includes(w) || BONUS_ANS.includes(w)); } catch (e) { found = []; }
const save = () => { try { localStorage.setItem(STORE, JSON.stringify(found)); } catch (e) {} };
let live = new Set();
const updateLive = () => { live = liveCells(ANSWERS.filter(w => !found.includes(w))); };
updateLive();

// ---------- 3D ----------
const stage = document.getElementById("stage");
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
stage.prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
camera.position.set(8.6, 6.2, 10.4);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.enablePan = false; controls.minDistance = 6; controls.maxDistance = 20;
scene.add(new THREE.AmbientLight(0xffffff, 0.75));
const dl = new THREE.DirectionalLight(0xffffff, 0.55); dl.position.set(5, 9, 6); scene.add(dl);

function letterTexture(ch, bg, fg, edge) {
  const c = document.createElement("canvas"); c.width = c.height = 128;
  const g = c.getContext("2d");
  g.beginPath(); g.roundRect(6, 6, 116, 116, 22); g.fillStyle = bg; g.fill();
  g.lineWidth = 5; g.strokeStyle = edge; g.stroke();
  g.fillStyle = fg; g.font = "600 70px Unbounded, Golos Text, sans-serif";
  g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(ch.toUpperCase(), 64, 70);
  const t = new THREE.CanvasTexture(c); t.anisotropy = 4; return t;
}
const meshes = [];
let spread = 1.75;
function makeMaterials() {
  return C.map((_, i) => {
    const s = sel.includes(i), last = s && sel[sel.length - 1] === i;
    const bg = s ? css("--sel") : css("--cell"), fg = s ? css("--sel-ink") : css("--cell-ink");
    return new THREE.SpriteMaterial({ map: letterTexture(BOARD[i], bg, fg, last ? css("--accent") : css("--line")), depthWrite: false });
  });
}
C.forEach((p, i) => {
  const m = new THREE.Sprite(new THREE.SpriteMaterial()); m.scale.set(0.95, 0.95, 1); m.userData.i = i; meshes.push(m); scene.add(m);
});
const frames = [0, 1, 2].map(() => { const f = new THREE.LineLoop(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({ transparent: true, opacity: 0.5 })); scene.add(f); return f; });
function place() {
  meshes.forEach((m, i) => m.position.set((C[i].x - 1) * spread, (1 - C[i].z) * spread, (C[i].y - 1) * spread));
  const h = spread * 1.5;
  frames.forEach((f, z) => { const y = (1 - z) * spread; f.geometry.setFromPoints([new THREE.Vector3(-h, y, -h), new THREE.Vector3(h, y, -h), new THREE.Vector3(h, y, h), new THREE.Vector3(-h, y, h)]); });
}
let pathLine = null;
function refresh3d() {
  const mats = makeMaterials();
  meshes.forEach((m, i) => { if (m.material) { if (m.material.map) m.material.map.dispose(); m.material.dispose(); } m.material = mats[i]; m.visible = live.has(i); });
  frames.forEach(f => f.material.color.set(css("--muted")));
  if (pathLine) { scene.remove(pathLine); pathLine.geometry.dispose(); }
  if (sel.length > 1) {
    const g = new THREE.BufferGeometry().setFromPoints(sel.map(i => meshes[i].position.clone()));
    pathLine = new THREE.Line(g, new THREE.LineBasicMaterial({ color: css("--accent") }));
    scene.add(pathLine);
  } else pathLine = null;
}
function resize() { const r = stage.getBoundingClientRect(); renderer.setSize(r.width, r.height, false); camera.aspect = r.width / r.height; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(stage);
document.getElementById("spread").addEventListener("input", e => { spread = +e.target.value; place(); refresh3d(); });

const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
let down = null;
renderer.domElement.addEventListener("pointerdown", e => { down = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener("pointerup", e => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 6) { down = null; return; }
  down = null;
  const r = renderer.domElement.getBoundingClientRect();
  ptr.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObjects(meshes.filter(m => m.visible), false).sort((a, b) => a.distance - b.distance)[0];
  if (hit) tap(hit.object.userData.i);
});
function loop() { controls.update(); renderer.render(scene, camera); requestAnimationFrame(loop); }

// ---------- логика ----------
const $ = id => document.getElementById(id);
function say(t, cls) { const m = $("msg"); m.textContent = t; m.className = "msg" + (cls ? " " + cls : ""); }
function tap(i) {
  if (!live.has(i)) return;
  const k = sel.indexOf(i);
  if (k >= 0) sel = sel.slice(0, k + (k === sel.length - 1 ? 0 : 1));
  else if (!sel.length || adj(sel[sel.length - 1], i)) sel.push(i);
  else { sel = [i]; }
  say("");
  const w = sel.map(j => BOARD[j]).join("");
  if (BONUS_ANS.includes(w) && !found.includes(w)) {
    found.push(w); save(); sel = []; say("Бонус: " + w + "!", "ok");
  } else if (ANSWERS.includes(w) && !found.includes(w)) {
    found.push(w); save(); sel = [];
    const before = live.size; updateLive();
    const gone = before - live.size;
    if (mainFound().length === ANSWERS.length) say("Все " + ANSWERS.length + " найдены! Куб пуст.", "ok");
    else say("Есть: " + w + "!" + (gone ? " Исчезло букв: " + gone + "." : ""), "ok");
  }
  render();
}

function renderLayers() {
  const L = $("layers"); L.innerHTML = "";
  const last = sel[sel.length - 1];
  for (let z = 0; z < 3; z++) {
    const box = document.createElement("div"); box.className = "layer";
    const g = document.createElement("div"); g.className = "grid3";
    for (let y = 0; y < 3; y++) for (let x = 0; x < 3; x++) {
      const i = x + 3 * y + 9 * z, b = document.createElement("button");
      if (!live.has(i)) { b.className = "cellbtn gone"; b.disabled = true; b.setAttribute("aria-label", "пусто"); g.appendChild(b); continue; }
      b.className = "cellbtn" + (sel.includes(i) ? " sel" : "") + (i === last ? " last" : "") + (last !== undefined && !sel.includes(i) && adj(last, i) ? " can" : "");
      b.id = "cell" + i; b.textContent = BOARD[i]; b.setAttribute("aria-label", "буква " + BOARD[i] + ", слой " + (z + 1));
      b.onclick = () => tap(i); g.appendChild(b);
    }
    box.appendChild(g); L.appendChild(box);
  }
}
function render() {
  const w = sel.map(i => BOARD[i]).join("");
  const W = $("word"); W.textContent = w || "Выбери первую букву"; W.className = "word" + (w ? "" : " empty");
  renderLayers(); refresh3d();
  $("count").textContent = mainFound().length; $("total").textContent = "из " + ANSWERS.length;
  $("bar").style.width = (100 * mainFound().length / ANSWERS.length) + "%";
  const F = $("found"); F.innerHTML = "";
  ANSWERS.forEach(w => {
    const c = document.createElement("span");
    if (found.includes(w)) { c.className = "chip"; c.textContent = w; }
    else { c.className = "chip slot"; c.setAttribute("aria-label", "не найдено, букв: " + w.length); c.innerHTML = "<i></i>".repeat(w.length); }
    F.appendChild(c);
  });
  const bonus = found.filter(w => BONUS_ANS.includes(w)).sort((a, b) => a.localeCompare(b, "ru"));
  const Bx = $("bonus"); Bx.hidden = !bonus.length; Bx.innerHTML = "";
  if (bonus.length) {
    const s = document.createElement("small"); s.textContent = "Бонус:"; Bx.appendChild(s);
    bonus.forEach(w => { const c = document.createElement("span"); c.className = "chip bonus"; c.textContent = w; Bx.appendChild(c); });
  }
}
$("clear").onclick = () => { sel = []; say(""); render(); };
$("reset").onclick = () => { found = []; sel = []; save(); updateLive(); say("Начали заново."); render(); };
document.addEventListener("keydown", e => {
  if (e.key === "Backspace") { sel.pop(); render(); }
  else if (e.key === "Escape") { sel = []; render(); }
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => refresh3d());
new MutationObserver(() => refresh3d()).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
place(); render(); resize(); loop();
document.fonts && document.fonts.ready.then(() => refresh3d());
</script>
